name: Publish public install release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to publish, for example v0.1.4
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ env.VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run build

      - name: Pack install artifact
        run: |
          mkdir -p release
          npm pack --pack-destination release
          cp release/thinkless-*.tgz release/thinkless.tgz
          cp scripts/install.sh release/install.sh
          cp scripts/install.ps1 release/install.ps1

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$VERSION" \
              release/thinkless.tgz \
              release/install.sh \
              release/install.ps1 \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Thinkless $VERSION" \
              --notes "Thinkless install release assets built from $VERSION."
          else
            gh release create "$VERSION" \
              release/thinkless.tgz \
              release/install.sh \
              release/install.ps1 \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Thinkless $VERSION" \
              --notes "Thinkless install release assets built from $VERSION."
          fi
